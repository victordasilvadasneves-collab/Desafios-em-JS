 <style>
    body{
        font-family: courier, monospace;

    .box-container{
        background-color: #000000;

        text-align: center;

        border-radius: 10px;

        .box-questions{

    button:hover{

    input{

        margin-top: 10px;
    }
 </style>
<body>

    <div class="box-questions">
        <h2>Desafio #00</h2>
        <hr>
        <p class="p_questions">questão...</p>

    </div>

    <div class="box-one">
